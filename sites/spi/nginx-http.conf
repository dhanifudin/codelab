# Rendered by provision/30-site.sh while no certificate exists (TLS_READY=0): plain HTTP only.
# Once DNS points at this server, provisioning issues the certificate (HTTP-01 through the
# ACME location below) and switches to nginx-https.conf.
server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAMES@;
    root @BASE@/current/public;

    access_log /var/log/nginx/@SITE@.access.log;
    error_log /var/log/nginx/@SITE@.error.log;

    index index.php;
    charset utf-8;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Let's Encrypt HTTP-01 challenges (provision/25-tls.sh).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    include snippets/@SITE@-app.conf;
}
