# Rendered by provision/30-site.sh to /etc/nginx/conf.d/@SITE@-limits.conf (http context, included by nginx.conf).
# Rate limit for password logins: 30 a minute per client IP, burst 20 (see app.conf). Sized for a campus
# behind one address: it stops password spraying, not a classroom logging in together. The per-account limit
# (5 failures a minute per username+IP) is in the app.
#
# Only POST /login/proses is counted: every other request maps to an empty key, which nginx does not limit.
map "$request_method:$request_uri" $@SITE@_login_key {
    default "";
    "~^POST:/login/proses" $binary_remote_addr;
}

limit_req_zone $@SITE@_login_key zone=@SITE@_login:10m rate=30r/m;
