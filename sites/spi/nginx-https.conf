# Rendered by provision/30-site.sh once a certificate covers the site (TLS_READY=1).
server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAMES@;

    # Renewals still validate over port 80.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @SERVER_NAMES@;
    root @BASE@/current/public;

    ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/@SITE@.access.log;
    error_log /var/log/nginx/@SITE@.error.log;

    index index.php;
    charset utf-8;
    client_max_body_size 20M;

    # 30 days while the domain is managed by someone else; raise once stable.
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include snippets/@SITE@-app.conf;
}
