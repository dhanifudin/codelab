# Shared by the HTTP and HTTPS vhosts. Rendered by provision/30-site.sh to /etc/nginx/snippets/@SITE@-app.conf.

# Password logins are rate limited per client IP. The zone and its key (POST /login/proses only; every other
# request has an empty key and is not counted) are in nginx-limits.conf, rendered to conf.d. Over the limit: 429.
limit_req zone=@SITE@_login burst=20 nodelay;
limit_req_status 429;

# There is no self-registration: the routes are gone from the app. These stay as defence in depth. The old
# exact-match rule let /register/ and /index.php/register through to the app.
location ~ ^/(index\.php/)?register/?$ { return 404; }

# index.php is only reached through the rewrite in `location /` below. A request that names it with a path
# (/index.php/anything) must never reach the app, because it would sidestep every rule in this file.
location ~ ^/index\.php/ { return 404; }

# Leftovers from the app repo that must never be public.
location ^~ /coverage-report { return 404; }
location ~* ^/(coverage\.xml|composer\.(json|lock)|package(-lock)?\.json|artisan|pelaporan)$ { return 404; }
location = /storage/temp_document.docx { return 404; }

# Asks the app whether this browser has a logged-in session: 204 yes, 401 no. nginx's auth_request treats any
# other answer (a redirect, for example) as a server error, which is why the app answers 401 itself.
location = /_auth {
    internal;
    fastcgi_pass unix:/run/php/php@PHP_VERSION@-fpm-@POOL_NAME@.sock;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param REQUEST_URI /auth/check;
    fastcgi_param QUERY_STRING "";
    fastcgi_param REQUEST_METHOD GET;
    fastcgi_param CONTENT_LENGTH "";
    fastcgi_param CONTENT_TYPE "";
    fastcgi_pass_request_body off;
}

# Audit documents, letters and reports: no download without a login (they used to be readable by anyone who
# could guess the predictable file name). Served as inert, sandboxed content (SVG can carry script). A
# location's add_header cancels the server-level headers, so the security headers are repeated here.
location ~* ^/(hasil_[a-z]+|koreksi_[A-Za-z_]+|surat_tugas|dokumen_tindaklanjut|sertifikat|dokumenPR|dokumenrev|dokumen|dokumen_auditee|profile_pictures)/ {
    auth_request /_auth;
    add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
}
location ~* ^/storage/(surat|surat_pdf|laporan_unit|laporan_spi|audit_lampiran|scan_hasil_audit|documents|lampiran_auditor)/ {
    auth_request /_auth;
    add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
}

# Content that is public on purpose: landing page images, the document templates, signatures (random names),
# and /storage/berita_acara (shown on the public landing page). Inert and sandboxed as well.
location ~* ^/(tanda_tangans|template_[a-z]+|landing_images|storage)/ {
    add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

location ~ ^/index\.php$ {
    fastcgi_pass unix:/run/php/php@PHP_VERSION@-fpm-@POOL_NAME@.sock;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    include fastcgi_params;
    fastcgi_hide_header X-Powered-By;
}

# No other PHP file is ever executed (uploads included).
location ~ \.php$ { return 404; }

location ~ /\.(?!well-known) { deny all; }
