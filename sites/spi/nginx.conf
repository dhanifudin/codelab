# Rendered by provision/30-site.sh; placeholders between at-signs come from site.conf.
# HTTP only until DNS exists; after cutover run `certbot --nginx -d @DOMAIN@`.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;
    root @BASE@/current/public;

    access_log /var/log/nginx/@SITE@.access.log;
    error_log /var/log/nginx/@SITE@.error.log;

    index index.php;
    charset utf-8;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Legacy app lets anyone pick their own role (incl. Super Admin) on /register.
    # Accounts are created by a Super Admin instead. Remove when v2 ships.
    location = /register { return 404; }

    # Leftovers from the app repo that must never be public.
    location ^~ /coverage-report { return 404; }
    location ~* ^/(coverage\.xml|composer\.(json|lock)|package(-lock)?\.json|artisan|pelaporan)$ { return 404; }

    # User-uploaded files: served as inert, sandboxed content (SVG can carry script).
    location ~* ^/(tanda_tangans|profile_pictures|hasil_[a-z]+|koreksi_[A-Za-z_]+|surat_tugas|dokumen_tindaklanjut|sertifikat|dokumenPR|dokumenrev|template_dokumen|landing_images|storage)/ {
        add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php@PHP_VERSION@-fpm-@POOL_NAME@.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # No other PHP file is ever executed (uploads included).
    location ~ \.php$ { return 404; }

    location ~ /\.(?!well-known) { deny all; }
}
