# Non-secret settings for the spi site. Sourced by bash (provision, deploy).
# Installed on the VPS as /etc/codelab/spi.conf by provision/30-site.sh.
SITE=spi
DOMAIN=spi.polinema.ac.id
APP_REPO=dhanifudin/spi.polinema.ac.id
PHP_VERSION=8.4
DEPLOY_USER=deploy
WEB_GROUP=www-data
BASE=/var/www/spi.polinema.ac.id
KEEP_RELEASES=2
DB_NAME=spi
DB_USER=spi
POOL_NAME=spi
# Extended settings (shared scripts read these for every site)
SERVER_NAMES=spi.polinema.ac.id
TLS=none
DISABLE_STOCK_POOL=0
PHP_EXTENSIONS="fpm cli common mysql gd zip mbstring xml curl intl bcmath"
NODE_BUILD=0
SMOKE_PATH=/login
SMOKE_SCHEME=http
ENV_REQUIRED="SPI_APP_KEY SPI_DB_PASSWORD"
