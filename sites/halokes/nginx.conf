# Rendered by provision/30-site.sh; placeholders between at-signs come from site.conf.
# Cloudflare-proxied (SSL mode Full strict). Origin cert: Let's Encrypt DNS-01 (provision/25-tls.sh).

# Direct hits on port 80 (Cloudflare normally upgrades to HTTPS before reaching us).
server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAMES@;
    include snippets/cloudflare-realip.conf;
    return 301 https://@DOMAIN@$request_uri;
}

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.@DOMAIN@;
    include snippets/cloudflare-realip.conf;

    ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://@DOMAIN@$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @DOMAIN@;
    root @BASE@/current/public;
    include snippets/cloudflare-realip.conf;

    ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/@SITE@.access.log;
    error_log /var/log/nginx/@SITE@.error.log;

    index index.php;
    charset utf-8;
    client_max_body_size 25M;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploaded files (public disk): inert, sandboxed content.
    location ^~ /storage/ {
        add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Vite output is content-hashed.
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php@PHP_VERSION@-fpm-@POOL_NAME@.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # No other PHP file is ever executed.
    location ~ \.php$ { return 404; }

    location ~ /\.(?!well-known) { deny all; }
}
