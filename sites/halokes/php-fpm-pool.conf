; Rendered by provision/30-site.sh into /etc/php/@PHP_VERSION@/fpm/pool.d/@POOL_NAME@.conf
[@POOL_NAME@]
user = @DEPLOY_USER@
group = @WEB_GROUP@
listen = /run/php/php@PHP_VERSION@-fpm-@POOL_NAME@.sock
listen.owner = @DEPLOY_USER@
listen.group = @WEB_GROUP@
listen.mode = 0660

; Small VPS (shared with other sites): spawn workers only on demand.
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 20s
pm.max_requests = 300

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 25M
php_admin_value[post_max_size] = 30M
php_admin_value[max_execution_time] = 180
php_admin_value[date.timezone] = Asia/Jakarta
php_admin_value[expose_php] = off
php_admin_value[session.cookie_httponly] = 1
php_admin_value[error_log] = /var/log/php@PHP_VERSION@-fpm-@POOL_NAME@.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
; Releases are immutable; fpm is reloaded on each switch, so cache aggressively.
php_admin_value[opcache.validate_timestamps] = 0
