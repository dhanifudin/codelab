# Non-secret settings for the halokes site. Sourced by bash (provision, deploy).
# Installed on the VPS as /etc/codelab/halokes.conf by provision/30-site.sh.
SITE=halokes
DOMAIN=halokes.com
# Hosts nginx serves (port 80 redirect, apex vhost). School hosts are listed in TENANTS too.
SERVER_NAMES="halokes.com www.halokes.com abs.halokes.com"
# What the Let's Encrypt certificate covers: apex plus a wildcard (DNS-01), so a new school host
# needs no certificate change. DNS stays explicit per host (dns.records).
CERT_NAMES="halokes.com *.halokes.com"
# School hosts, as host:KODE (KODE = kode_yayasan of the school's yayasan in the app).
TENANTS="abs.halokes.com:ABS"
APP_REPO=dhanifudin/halokes
# php8.4-fpm already serves other sites on this VPS: only the halokes pool is added.
PHP_VERSION=8.4
PHP_EXTENSIONS="fpm cli common mysql gd zip mbstring xml curl intl"
DISABLE_STOCK_POOL=0
DEPLOY_USER=deploy
WEB_GROUP=www-data
BASE=/var/www/halokes.com
KEEP_RELEASES=2
DB_NAME=halokes
DB_USER=halokes
POOL_NAME=halokes
# Cloudflare-proxied zone; origin cert via Let's Encrypt DNS-01.
TLS=letsencrypt-cloudflare
CF_ZONE=halokes.com
NODE_BUILD=1
NODE_VERSION=22
PKG_MANAGER=npm
SMOKE_PATH=/up
SMOKE_SCHEME=https
SEED_CLASS=ProductionSeeder
ENV_REQUIRED="HALOKES_APP_KEY HALOKES_DB_PASSWORD"
