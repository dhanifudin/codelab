# Non-secret settings for the sirw site. Sourced by bash (provision, deploy).
# Installed on the VPS as /etc/codelab/sirw.conf by provision/30-site.sh.
SITE=sirw
DOMAIN=rw05tanjungrejo.or.id
SERVER_NAMES="rw05tanjungrejo.or.id www.rw05tanjungrejo.or.id"
APP_REPO=dhanifudin/rw05tanjungrejo
# php8.4-fpm already serves other sites on this VPS: only the sirw pool is added.
PHP_VERSION=8.4
# exif ships with the common package.
PHP_EXTENSIONS="fpm cli common mysql gd zip mbstring xml curl intl bcmath"
DISABLE_STOCK_POOL=0
DEPLOY_USER=deploy
WEB_GROUP=www-data
BASE=/var/www/rw05tanjungrejo.or.id
KEEP_RELEASES=2
DB_NAME=sirw
DB_USER=sirw
POOL_NAME=sirw
# Cloudflare-proxied zone; origin cert via Let's Encrypt DNS-01.
TLS=letsencrypt-cloudflare
CF_ZONE=rw05tanjungrejo.or.id
# Front-end assets are committed in the app repository.
NODE_BUILD=0
SMOKE_PATH=/login
SMOKE_SCHEME=https
# Safe to run again: creates the super-admin, roles and master data only.
SEED_CLASS=ProductionSeeder
# Encrypted nightly backup of the database and uploads to a private R2 bucket (provision/45-backup.sh).
BACKUP=1
BACKUP_KEEP_DAYS=30
ENV_REQUIRED="SIRW_APP_KEY SIRW_DB_PASSWORD SIRW_ADMIN_EMAIL SIRW_ADMIN_PASSWORD SIRW_MAIL_HOST SIRW_MAIL_USERNAME SIRW_MAIL_PASSWORD"
