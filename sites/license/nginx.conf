# Rendered by provision/30-site.sh; placeholders between at-signs come from site.conf.
# Cloudflare-proxied (SSL mode Full strict). Origin cert: Let's Encrypt DNS-01 (provision/25-tls.sh).
# Reverse proxy only: nothing is served from disk (payment proofs are private files).

server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAMES@;
    include snippets/cloudflare-realip.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @SERVER_NAMES@;
    include snippets/cloudflare-realip.conf;

    ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/@SITE@.access.log;
    error_log /var/log/nginx/@SITE@.error.log;

    client_max_body_size 6M;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:@APP_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
