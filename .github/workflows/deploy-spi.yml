name: Deploy spi

on:
  repository_dispatch:
    types: [deploy-spi]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA of dhanifudin/spi.polinema.ac.id
        default: main
        required: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      site: spi
      ref: ${{ inputs.ref }}
    secrets: inherit
