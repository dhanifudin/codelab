name: Deploy site (reusable)

on:
  workflow_call:
    inputs:
      site:
        description: Directory name under sites/
        required: true
        type: string
      ref:
        description: Branch, tag or SHA of the app repo (defaults to the dispatched sha, else main)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: deploy-${{ inputs.site }}
      cancel-in-progress: false
    steps:
      - name: Validate site name
        env:
          SITE: ${{ inputs.site }}
        run: |
          [[ "$SITE" =~ ^[a-z0-9-]+$ ]] || { echo "bad site name" >&2; exit 1; }
          echo "SITE=$SITE" >> "$GITHUB_ENV"

      - name: Validate app ref
        env:
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          # A dispatched sha must be a full commit id; a manual ref may be a branch, tag or sha.
          # This limits what a leaked dispatch token can make the runner check out.
          if [ -n "$DISPATCH_SHA" ] && ! [[ "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "client_payload.sha is not a 40-hex commit id" >&2; exit 1
          fi
          if [ -n "$INPUT_REF" ] && ! [[ "$INPUT_REF" =~ ^[A-Za-z0-9._/-]{1,100}$ ]]; then
            echo "ref contains unexpected characters" >&2; exit 1
          fi

      - name: Checkout codelab (ops)
        uses: actions/checkout@v4

      - name: Load site config
        run: |
          # shellcheck source=/dev/null
          set -a; . "sites/${SITE}/site.conf"; set +a
          {
            echo "DOMAIN=$DOMAIN"
            echo "APP_REPO=$APP_REPO"
            echo "KIND=${KIND:-laravel}"
            echo "PHP_VERSION=${PHP_VERSION:-}"
            echo "BASE=$BASE"
            echo "NODE_BUILD=${NODE_BUILD:-0}"
            echo "NODE_VERSION=${NODE_VERSION:-22}"
            echo "PKG_MANAGER=${PKG_MANAGER:-npm}"
            echo "SMOKE_PATH=${SMOKE_PATH:-/}"
            echo "SMOKE_SCHEME=${SMOKE_SCHEME:-http}"
          } >> "$GITHUB_ENV"

      - name: Checkout app
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          # Public apps need no token; private ones need APP_READ_TOKEN (fine-grained PAT, Contents: read).
          token: ${{ secrets.APP_READ_TOKEN || github.token }}
          ref: ${{ github.event.client_payload.sha || inputs.ref || 'main' }}
          path: app

      - name: Resolve release id
        working-directory: app
        run: echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: shivammathur/setup-php@v2
        if: env.KIND != 'go'
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: gd, zip, mbstring, xml, pdo_mysql, intl, bcmath
          tools: composer:v2

      - name: Composer install
        if: env.KIND != 'go'
        working-directory: app
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - uses: actions/setup-node@v4
        if: env.KIND != 'go' && env.NODE_BUILD == '1'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend assets
        if: env.KIND != 'go' && env.NODE_BUILD == '1'
        working-directory: app
        run: |
          if [ "$PKG_MANAGER" = pnpm ]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run build
          else
            npm ci --no-audit --no-fund
            npm run build
          fi

      - uses: actions/setup-go@v5
        if: env.KIND == 'go'
        with:
          go-version-file: app/go.mod

      - name: Build Go binary
        if: env.KIND == 'go'
        working-directory: app
        run: |
          # The app repo's CI already ran the tests for this sha; this only builds.
          install -d -m 755 "$RUNNER_TEMP/release"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/release/licensed" ./cmd/licensed

      - name: Render .env
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          # Export only this site's secrets and variables (<SITE>_*); values stay in this step's process.
          prefix="${SITE^^}_"
          while IFS=$'\t' read -r k v; do
            export "$k=$v"
          done < <(jq -r --arg p "$prefix" \
            'to_entries[] | select(.key | startswith($p)) | select(.value | contains("\n") | not) | "\(.key)\t\(.value)"' \
            <<<"$SECRETS_JSON"$'\n'"$VARS_JSON" )
          umask 077
          scripts/render-env.sh "$SITE" > "$RUNNER_TEMP/site.env"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload release
        run: |
          if [ "$KIND" = go ]; then
            rsync -az --delete "$RUNNER_TEMP/release/" "vps:${BASE}/releases/${SHA}/"
          else
            rsync -az --delete --exclude-from="sites/${SITE}/rsync-exclude.txt" \
              app/ "vps:${BASE}/releases/${SHA}/"
          fi
          rsync -az "$RUNNER_TEMP/site.env" "vps:${BASE}/shared/.env"

      - name: Activate
        id: activate
        run: ssh vps "bash -s -- ${SITE} ${SHA}" < scripts/remote/activate.sh

      - name: Smoke test (straight to the origin)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          # Both ports resolve to the origin and up to 2 redirects are followed, so the same check passes
          # before (HTTP) and after (HTTP redirecting to HTTPS) a site gets its certificate.
          code=000
          for i in 1 2 3 4 5; do
            code=$(curl -s -L --max-redirs 2 -o /dev/null -w '%{http_code}' \
              --resolve "${DOMAIN}:80:${SSH_HOST}" --resolve "${DOMAIN}:443:${SSH_HOST}" \
              "${SMOKE_SCHEME}://${DOMAIN}${SMOKE_PATH}" || true)
            [ "$code" = 200 ] && break
            sleep 3
          done
          echo "GET ${SMOKE_PATH} -> $code"
          [ "$code" = 200 ]

      - name: Roll back on failure
        if: failure() && steps.activate.outcome == 'success'
        run: ssh vps "bash -s -- ${SITE}" < scripts/remote/rollback.sh || true
